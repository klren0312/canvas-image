<h2>手动插入功能 - 设计方案 v2</h2>
<p class="subtitle">图标列表 + 弹框确认的交互方式</p>

<div class="section">
  <h3>1. 工具框设计</h3>
  <div class="mockup">
    <div class="mockup-header">左侧工具栏（图标列表）</div>
    <div class="mockup-body" style="padding: 15px;">
      <div style="display: flex; flex-direction: column; gap: 8px; align-items: center;">
        <div style="width: 40px; height: 40px; background: #333; border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px;" title="插入文本">T</div>
        <div style="width: 40px; height: 40px; background: #333; border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px;" title="上传图片">🖼</div>
        <div style="border-top: 1px solid #444; width: 30px;"></div>
        <div style="width: 40px; height: 40px; background: #333; border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px;" title="其他工具">⋯</div>
      </div>
    </div>
  </div>
</div>

<div class="section">
  <h3>2. 弹框设计</h3>
  <div class="mockup">
    <div class="mockup-header">插入文本弹框</div>
    <div class="mockup-body" style="padding: 15px;">
      <div style="background: #2a2a2a; border-radius: 8px; padding: 15px; max-width: 300px;">
        <div style="font-size: 14px; color: white; margin-bottom: 12px;">插入文本</div>
        <input class="mock-input" placeholder="输入文本内容" style="width: 100%; margin-bottom: 10px;">
        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
          <div style="flex: 1;">
            <div style="font-size: 12px; color: #999; margin-bottom: 4px;">字体大小</div>
            <select class="mock-input" style="width: 100%;">
              <option>24px</option>
              <option>32px</option>
              <option>48px</option>
              <option>64px</option>
            </select>
          </div>
          <div style="flex: 1;">
            <div style="font-size: 12px; color: #999; margin-bottom: 4px;">文字颜色</div>
            <input type="color" value="#ffffff" style="width: 100%; height: 32px;">
          </div>
        </div>
        <div style="display: flex; gap: 8px; justify-content: flex-end;">
          <button class="mock-button" style="background: #555;">取消</button>
          <button class="mock-button">确定插入</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="section">
  <h3>3. 上传图片弹框</h3>
  <div class="mockup">
    <div class="mockup-header">上传图片弹框</div>
    <div class="mockup-body" style="padding: 15px;">
      <div style="background: #2a2a2a; border-radius: 8px; padding: 15px; max-width: 300px;">
        <div style="font-size: 14px; color: white; margin-bottom: 12px;">上传图片</div>
        <div style="border: 2px dashed #444; border-radius: 4px; padding: 30px; text-align: center; color: #666; font-size: 12px; margin-bottom: 12px;">
          拖拽图片到此处<br>或点击选择文件
        </div>
        <div style="font-size: 12px; color: #999; margin-bottom: 12px;">支持格式：JPG、PNG、GIF</div>
        <div style="display: flex; gap: 8px; justify-content: flex-end;">
          <button class="mock-button" style="background: #555;">取消</button>
          <button class="mock-button" disabled>确定插入</button>
        </div>
      </div>
    </div>
  </div>
</div>
