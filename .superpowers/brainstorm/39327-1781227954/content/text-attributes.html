<h2>手动插入文本的属性编辑</h2>
<p class="subtitle">选择文本插入时支持的属性</p>

<div class="options" data-multiselect>
  <div class="option" data-choice="content" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>文本内容</h3>
      <p>输入要插入的文本内容</p>
    </div>
  </div>

  <div class="option" data-choice="font-size" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>字体大小</h3>
      <p>可调整字体大小（默认 32px）</p>
    </div>
  </div>

  <div class="option" data-choice="color" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>文字颜色</h3>
      <p>可选择文字颜色（默认白色）</p>
    </div>
  </div>

  <div class="option" data-choice="position" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>插入位置</h3>
      <p>可指定插入位置或点击画布放置</p>
    </div>
  </div>
</div>
