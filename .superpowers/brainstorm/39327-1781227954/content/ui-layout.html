<h2>手动插入功能的 UI 入口布局</h2>
<p class="subtitle">选择手动插入功能的入口位置</p>

<div class="options">
  <div class="option" data-choice="toolbar" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>顶部工具栏</h3>
      <p>在画布顶部添加一个工具栏，包含"插入文本"和"上传图片"按钮</p>
      <div class="mockup">
        <div class="mockup-header">画布顶部</div>
        <div class="mockup-body" style="padding: 10px;">
          <div style="display: flex; gap: 10px; align-items: center;">
            <button class="mock-button">插入文本</button>
            <button class="mock-button">上传图片</button>
            <span style="color: #666; margin-left: 20px;">|</span>
            <span style="color: #666; margin-left: 20px;">画布区域</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="option" data-choice="floating" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>浮动面板</h3>
      <p>在画布侧边添加一个可折叠的浮动面板，包含所有手动插入工具</p>
      <div class="mockup">
        <div class="mockup-header">画布侧边</div>
        <div class="mockup-body" style="padding: 10px;">
          <div style="display: flex; gap: 10px;">
            <div style="width: 120px; background: #2a2a2a; padding: 10px; border-radius: 4px;">
              <div style="color: #42b883; font-size: 12px; margin-bottom: 8px;">手动插入</div>
              <button class="mock-button" style="width: 100%; margin-bottom: 5px;">插入文本</button>
              <button class="mock-button" style="width: 100%;">上传图片</button>
            </div>
            <div style="flex: 1; color: #666;">画布区域</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="option" data-choice="context" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>右键菜单</h3>
      <p>在画布上右键点击，弹出上下文菜单，包含插入选项</p>
      <div class="mockup">
        <div class="mockup-header">右键菜单</div>
        <div class="mockup-body" style="padding: 10px;">
          <div style="position: relative; height: 100px;">
            <div style="color: #666;">画布区域</div>
            <div style="position: absolute; right: 20px; top: 20px; background: #333; border: 1px solid #444; border-radius: 4px; padding: 5px 0; min-width: 120px;">
              <div style="padding: 5px 15px; color: white; font-size: 13px;">插入文本</div>
              <div style="padding: 5px 15px; color: white; font-size: 13px;">上传图片</div>
              <div style="border-top: 1px solid #444; margin: 3px 0;"></div>
              <div style="padding: 5px 15px; color: #999; font-size: 13px;">其他操作...</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
