<h2>图片插入后的编辑功能</h2>
<p class="subtitle">选择图片插入后支持的编辑功能</p>

<div class="options" data-multiselect>
  <div class="option" data-choice="resize" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>缩放</h3>
      <p>拖拽边角调整图片大小</p>
    </div>
  </div>

  <div class="option" data-choice="move" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>移动</h3>
      <p>拖拽图片到画布任意位置</p>
    </div>
  </div>

  <div class="option" data-choice="rotate" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>旋转</h3>
      <p>拖拽旋转手柄调整图片角度</p>
    </div>
  </div>

  <div class="option" data-choice="delete" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>删除</h3>
      <p>选中图片后按 Delete 键或点击删除按钮</p>
    </div>
  </div>

  <div class="option" data-choice="z-index" onclick="toggleSelect(this)">
    <div class="letter">E</div>
    <div class="content">
      <h3>层级调整</h3>
      <p>调整图片在画布中的前后层级</p>
    </div>
  </div>
</div>
